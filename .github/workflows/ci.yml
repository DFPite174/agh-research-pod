name: research-software-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frozen baseline
        run: python -m pip install -r requirements-lock.txt
      - name: Install and build
        run: |
          python -m pip install --no-deps -e .
          python -m build
      - name: Prepare writable test directory
        run: python -c "from pathlib import Path; Path('runtime').mkdir(exist_ok=True)"
      - name: Behavioral and mathematical tests
        run: python -m pytest -q --basetemp=runtime/ci-tests --junitxml=runtime/junit.xml
      - name: Syntax and unused imports
        run: python -m pyflakes src tests examples/quant examples/research
      - name: Installed CLI smoke
        run: agh --root runtime/ci-demo demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: runtime/junit.xml

# Provider credentials and commercial datasets are intentionally absent from PR CI.
